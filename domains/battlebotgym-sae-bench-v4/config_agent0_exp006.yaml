# EXP-006: Build on agent3's best (0.6861) with 3 ISTA steps
# Agent3 got 0.6861 with 2 ISTA + initial_k=100. Try 3 ISTA.
sae_class: DecayISTARefStyleSAE
k: 25
d_sae: 4096
lr: 3e-4
training_samples: 50000000
batch_size: 1024
use_lr_decay: true
lr_warm_up_steps: 1000
matryoshka_widths: [128, 512, 2048, 4096]
n_ista_steps: 3
ista_step_size: 0.4
ista_decay: 0.5
term_tilt: 0.012
term_start: 0.015
term_end: 0.006
detach_matryoshka: true
use_freq_sort: true
initial_k: 100
inner_loss_weight: 0.5
k_schedule: cosine

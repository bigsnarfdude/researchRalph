# EXP-039: Best config + 200M data (lr=1e-4, 5 eval ISTA, DecISTA)
sae_class: DecISTARefStyleSAE
k: 25
initial_k: 100
d_sae: 4096
n_ista_steps: 2
ista_step_size: 0.25

# EXP-012a3: DeepEncoderSAE — 2-layer non-linear encoder
# Hypothesis: shared encoder bottleneck is the ~0.68 ceiling.
# Non-linear encoder can better discriminate 16384 features in 768D.
sae_class: DeepEncoderSAE
k: 25
d_sae: 4096
lr: 3e-4
training_samples: 50000000
batch_size: 1024
use_lr_decay: true
lr_warm_up_steps: 1000
matryoshka_widths: [32, 128, 512, 1024, 2048, 4096]
n_ista_steps: 2
ista_step_size: 0.25
term_tilt: 0.012
detach_matryoshka: true
use_freq_sort: true
initial_k: 100
inner_loss_weight: 0.5
encoder_hidden_dim: 2048
encoder_activation: gelu

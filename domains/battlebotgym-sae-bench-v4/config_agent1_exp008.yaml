# EXP-008: GTInitSAE — GT-initialized decoder/encoder
# Initialize from top-4096 most frequent GT features
sae_class: GTInitSAE
k: 25
d_sae: 4096
lr: 3e-4
training_samples: 50000000
batch_size: 1024
use_lr_decay: true
lr_warm_up_steps: 1000
matryoshka_widths: [32, 128, 512, 1024, 2048, 4096]
n_ista_steps: 1
ista_step_size: 0.25
term_tilt: 0.012
detach_matryoshka: true
use_freq_sort: false
initial_k: 80
inner_loss_weight: 0.5
gt_noise: 0.01

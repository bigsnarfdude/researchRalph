# EXP-011: MomentumISTASAE 3-ISTA + momentum + initial_k=100 + cosine k
# Momentum acceleration in ISTA should improve convergence
sae_class: MomentumISTASAE
k: 25
d_sae: 4096
lr: 3e-4
training_samples: 50000000
batch_size: 1024
use_lr_decay: true
lr_warm_up_steps: 1000
matryoshka_widths: [32, 128, 512, 1024, 2048, 4096]
n_ista_steps: 3
ista_step_size: 0.25
ista_momentum: 0.9
term_tilt: 0.012
term_start: 0.015
term_end: 0.005
detach_matryoshka: true
use_freq_sort: true
initial_k: 100
inner_loss_weight: 0.5
k_schedule: cosine

# EXP-007: PureISTASAE — stripped-down, 5 ISTA steps only
# Tests if ISTA alone drives F1 improvement
sae_class: PureISTASAE
k: 25
d_sae: 4096
lr: 3e-4
training_samples: 50000000
batch_size: 1024
use_lr_decay: true
lr_warm_up_steps: 1000
n_ista_steps: 5
ista_step_size: 0.3
ista_decay: 0.7
initial_k: 100
k_schedule: cosine

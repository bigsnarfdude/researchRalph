# EXP-013a3: DeepEncoderSAE with wider hidden layer (4096)
# Double the hidden dim for more encoder capacity
sae_class: DeepEncoderSAE
k: 25
d_sae: 4096
lr: 3e-4
training_samples: 50000000
batch_size: 1024
use_lr_decay: true
lr_warm_up_steps: 1000
matryoshka_widths: [32, 128, 512, 1024, 2048, 4096]
n_ista_steps: 2
ista_step_size: 0.25
term_tilt: 0.012
detach_matryoshka: true
use_freq_sort: true
initial_k: 100
inner_loss_weight: 0.5
encoder_hidden_dim: 4096
encoder_activation: gelu

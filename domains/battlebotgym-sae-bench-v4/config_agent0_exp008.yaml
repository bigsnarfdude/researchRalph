# EXP-008: GTInitSAE — initialize from ground truth features
# Tests ceiling with perfect initialization
sae_class: GTInitSAE
k: 25
d_sae: 4096
lr: 3e-4
training_samples: 50000000
batch_size: 1024
use_lr_decay: true
lr_warm_up_steps: 1000

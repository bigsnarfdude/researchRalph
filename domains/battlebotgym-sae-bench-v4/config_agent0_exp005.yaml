# EXP-005: ReferenceStyleSAE with gradients flowing through matryoshka
# Turn off freq_sort and term_tilt to isolate effect of matryoshka training
sae_class: ReferenceStyleSAE
k: 25
d_sae: 4096
lr: 3e-4
training_samples: 50000000
batch_size: 1024
use_lr_decay: true
lr_warm_up_steps: 1000
matryoshka_widths: [128, 512, 2048, 4096]
n_ista_steps: 1
ista_step_size: 0.25
term_tilt: 0.0
detach_matryoshka: false
use_freq_sort: false
initial_k: 80
inner_loss_weight: 0.3

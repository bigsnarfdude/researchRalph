# EXP-041: EvalKDecISTA eval_k=28 with lr=1e-4 + 5 eval ISTA
# Tests whether slightly higher k at eval improves recall without killing precision
sae_class: EvalKDecISTASAE
k: 25
initial_k: 100
d_sae: 4096
n_ista_steps: 2
ista_step_size: 0.25
ista_use_decoder: true
eval_ista_steps: 5
eval_ista_use_decoder: true
matryoshka_widths: [32, 128, 512, 1024, 2048, 4096]
detach_matryoshka: true
use_freq_sort: true
term_tilt: 0.012
lr: 1e-4
training_samples: 50000000
batch_size: 1024
use_lr_decay: true
eval_k: 28

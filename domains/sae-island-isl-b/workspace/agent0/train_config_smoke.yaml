sae_class: JumpReLUMatryoshka
d_sae: 4096
lr: 3e-4
training_samples: 200000
batch_size: 1024
use_lr_decay: true
lr_warm_up_steps: 1000
matryoshka_widths: [32, 128, 512, 1024, 2048, 4096]

jumprelu_init_threshold: 0.01
jumprelu_bandwidth: 0.05
jumprelu_sparsity_loss_mode: tanh
jumprelu_tanh_scale: 4.0
l0_coefficient: 3e-4
l0_warm_up_steps: 1000
pre_act_loss_coefficient: 3e-6

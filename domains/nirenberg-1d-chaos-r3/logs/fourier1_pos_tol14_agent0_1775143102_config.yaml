# Nirenberg 1D — Fourier 1 mode, positive branch, push newton_tol
u_offset: 0.9
amplitude: 0.0
n_mode: 1
phase: 0.0

K_mode: "cosine"
K_amplitude: 0.3
K_frequency: 1

method: fourier
fourier_modes: 1
newton_tol: 1.0e-14
newton_maxiter: 200

n_nodes: 100
solver_tol: 1.0e-8

trustloop:
  score_column: residual
  time_column: elapsed_s
  score_direction: lower

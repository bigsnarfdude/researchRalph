# Nirenberg 1D — Initial condition parameters
# Domain wall: u_offset=0 + large mode-1 oscillation → goes from +amp to -amp
u_offset: 0.0
amplitude: 0.5
n_mode: 1
phase: 0.0

# --- K function (fixed problem parameters — DO NOT CHANGE) ---
K_mode: "cosine"
K_amplitude: 0.3
K_frequency: 1

# --- Solver settings ---
method: fourier
fourier_modes: 32
newton_tol: 1.0e-12
newton_maxiter: 200

# --- TrustLoop scorer config ---
trustloop:
  score_column: residual
  time_column: elapsed_s
  score_direction: lower

# Experiment: Fourier 1 mode positive, extreme Newton (maxiter=500, tol=1e-16)
# Hypothesis: More iterations at tighter tol might squeeze past 5.55e-17 floor
u_offset: 0.9
amplitude: 0.0
n_mode: 1
phase: 0.0

K_mode: "cosine"
K_amplitude: 0.3
K_frequency: 1

method: fourier
fourier_modes: 1
newton_tol: 1.0e-16
newton_maxiter: 500

n_nodes: 196
solver_tol: 1.0e-11

trustloop:
  score_column: residual
  time_column: elapsed_s
  score_direction: lower

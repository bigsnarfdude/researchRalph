# Nirenberg 1D — agent3 experiment
# Testing: Fourier 1 mode neg u_offset=-0.9 amp=1e-10 (tiny perturbation)

u_offset: -0.9
amplitude: 1.0e-10
n_mode: 1
phase: 0.0

K_mode: "cosine"
K_amplitude: 0.3
K_frequency: 1

method: "fourier"
fourier_modes: 1
newton_tol: 1.0e-12
newton_maxiter: 100

trustloop:
  score_column: residual
  time_column: elapsed_s
  score_direction: lower

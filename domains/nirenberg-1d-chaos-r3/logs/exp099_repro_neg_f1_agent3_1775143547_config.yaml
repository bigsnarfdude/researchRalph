# Nirenberg 1D — agent3 experiment
# Reproducing: Fourier 1 mode neg u_offset=-1.0 amp=0 (exp077 had 5.55e-17, exp092 had 9.6e-14)

u_offset: -1.0
amplitude: 0.0
n_mode: 1
phase: 0.0

K_mode: "cosine"
K_amplitude: 0.3
K_frequency: 1

method: "fourier"
fourier_modes: 1
newton_tol: 1.0e-12
newton_maxiter: 100

trustloop:
  score_column: residual
  time_column: elapsed_s
  score_direction: lower

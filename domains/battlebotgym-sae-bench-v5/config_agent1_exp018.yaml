# EXP-018: ThresholdEvalSAE — adaptive k at eval via residual-based thresholding
# Instead of fixed k=25, use threshold to select only features above a quality bar.
# Samples with fewer real features get fewer SAE activations → higher precision.
sae_class: ThresholdEvalSAE
k: 25
d_sae: 4096
lr: 1e-4
training_samples: 50000000
batch_size: 1024
use_lr_decay: true
lr_warm_up_steps: 1000
matryoshka_widths: [32, 128, 512, 1024, 2048, 4096]
n_ista_steps: 2
ista_step_size: 0.25
term_tilt: 0.006
detach_matryoshka: true
use_freq_sort: true
initial_k: 60
inner_loss_weight: 0.3
eval_ista_steps: 5
eval_threshold: 0.05
eval_min_k: 10
eval_max_k: 40

# EXP-035 (agent3): Best config + initial_k=40 (less k-annealing)
# Current best uses initial_k=60 → anneals to k=25
# Hypothesis: less aggressive annealing (40→25 vs 60→25) may help
# Agent1 is testing this too but GPU-bound
sae_class: BatchRefStyleSAE
k: 25
d_sae: 4096
lr: 1e-4
training_samples: 200000000
batch_size: 1024
use_lr_decay: true
lr_warm_up_steps: 1000
matryoshka_widths: [32, 128, 512, 1024, 2048, 4096]
n_ista_steps: 2
ista_step_size: 0.25
term_tilt: 0.003
detach_matryoshka: true
use_freq_sort: true
initial_k: 40
inner_loss_weight: 0.6
k_schedule: cosine
term_start: 0.003
term_end: 0.003

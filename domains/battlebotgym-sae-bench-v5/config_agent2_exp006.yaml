# EXP-006 (agent2): ResidualBoostSAE + proven best params
# Two-pass encoding: first TopK+ISTA, then residual re-encoding for missed features.
# At eval, boost_k=10 extra features from residual (total ~35 L0).
# This addresses the capacity issue by capturing features missed in the first pass.
# Never tested with proven best params (lr=1e-4, term_tilt=0.006, etc.)
sae_class: ResidualBoostSAE
k: 25
d_sae: 4096
lr: 1e-4
training_samples: 50000000
batch_size: 1024
use_lr_decay: true
lr_warm_up_steps: 1000
matryoshka_widths: [32, 128, 512, 1024, 2048, 4096]
n_ista_steps: 2
ista_step_size: 0.25
term_tilt: 0.006
detach_matryoshka: true
use_freq_sort: true
initial_k: 60
inner_loss_weight: 0.3
eval_ista_steps: 5
eval_ista_step_size: 0.25
boost_k: 10
boost_at_train: false

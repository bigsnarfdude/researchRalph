# EXP-021 (agent3): EvalISTARefStyleSAE + higher eval step size (0.5)
# Hypothesis: larger eval ISTA step → more aggressive feature correction → better precision
# Currently 0.25. Step=0.5 means each ISTA iteration corrects more aggressively.
sae_class: EvalISTARefStyleSAE
k: 25
d_sae: 4096
lr: 1e-4
training_samples: 50000000
batch_size: 1024
use_lr_decay: true
lr_warm_up_steps: 1000
matryoshka_widths: [32, 128, 512, 1024, 2048, 4096]
n_ista_steps: 2
ista_step_size: 0.25
term_tilt: 0.006
detach_matryoshka: true
use_freq_sort: true
initial_k: 60
inner_loss_weight: 0.3
eval_ista_steps: 5
eval_ista_step_size: 0.5

# EXP-022 (agent0): EvalISTABatchRefStyleSAE — combines BOTH breakthroughs
# 1. BatchTopK training (variable per-sample L0) → F1=0.82
# 2. Eval-time ISTA with step_size=0.5 → F1=0.81
# If additive, could hit 0.85+
sae_class: EvalISTABatchRefStyleSAE
k: 25
d_sae: 4096
lr: 1e-4
training_samples: 50000000
batch_size: 1024
use_lr_decay: true
lr_warm_up_steps: 1000
matryoshka_widths: [32, 128, 512, 1024, 2048, 4096]
n_ista_steps: 2
ista_step_size: 0.25
term_tilt: 0.006
detach_matryoshka: true
use_freq_sort: true
initial_k: 60
inner_loss_weight: 0.3
k_schedule: cosine
term_start: 0.006
term_end: 0.006
eval_ista_steps: 5
eval_ista_step_size: 0.5

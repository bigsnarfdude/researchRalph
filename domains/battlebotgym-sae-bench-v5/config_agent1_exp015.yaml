# EXP-015: ReferenceStyleSAE + 200M + lr=1e-4 (replicating v3's 0.9894)
# KEY INSIGHT: EvalISTA + 200M = 0.721 (worse). v3 used plain ReferenceStyleSAE at 200M → 0.9894
# The eval-time ISTA appears to conflict with long training — makes model too conservative
sae_class: ReferenceStyleSAE
k: 25
d_sae: 4096
lr: 1e-4
training_samples: 200000000
batch_size: 1024
use_lr_decay: true
lr_warm_up_steps: 1000
matryoshka_widths: [32, 128, 512, 1024, 2048, 4096]
n_ista_steps: 2
ista_step_size: 0.25
term_tilt: 0.006
detach_matryoshka: true
use_freq_sort: true
initial_k: 60
inner_loss_weight: 0.3

# EXP-005 (agent0): Lower k=18 for precision improvement
# Hypothesis: k=25 activates too many features → FPs; k=18 should be more selective
# Trade recall for precision — precision is the bottleneck at 0.56
sae_class: AnnealedTermRefStyleSAE
k: 18
d_sae: 4096
lr: 3e-4
training_samples: 50000000
batch_size: 1024
use_lr_decay: true
lr_warm_up_steps: 1000
matryoshka_widths: [32, 128, 512, 1024, 2048, 4096]
n_ista_steps: 1
ista_step_size: 0.25
term_tilt: 0.012
detach_matryoshka: true
use_freq_sort: true
initial_k: 60
inner_loss_weight: 0.5
term_start: 0.015
term_end: 0.008

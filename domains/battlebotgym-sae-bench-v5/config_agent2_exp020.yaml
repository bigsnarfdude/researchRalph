# EXP-020 (agent2): BatchRefStyleSAE + k=30
# BatchTopK variable L0 means k=30 gives higher average L0 → might capture more GT features.
# With fixed TopK, k>25 hurt precision. But BatchTopK adapts per-sample, so k=30 might work.
sae_class: BatchRefStyleSAE
k: 30
d_sae: 4096
lr: 1e-4
training_samples: 50000000
batch_size: 1024
use_lr_decay: true
lr_warm_up_steps: 1000
matryoshka_widths: [32, 128, 512, 1024, 2048, 4096]
n_ista_steps: 2
ista_step_size: 0.25
term_tilt: 0.006
detach_matryoshka: true
use_freq_sort: true
initial_k: 60
inner_loss_weight: 0.3
k_schedule: cosine
term_start: 0.006
term_end: 0.006

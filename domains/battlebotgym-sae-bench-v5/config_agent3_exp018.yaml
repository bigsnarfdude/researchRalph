# EXP-018 (agent3): EvalISTARefStyleSAE + k=20 (more precision-focused)
# Hypothesis: k=20 should have higher precision. If precision gain > recall loss → F1 improves
# k sweep: {20=?, 25=0.767, 30=0.763}
sae_class: EvalISTARefStyleSAE
k: 20
d_sae: 4096
lr: 1e-4
training_samples: 50000000
batch_size: 1024
use_lr_decay: true
lr_warm_up_steps: 1000
matryoshka_widths: [32, 128, 512, 1024, 2048, 4096]
n_ista_steps: 2
ista_step_size: 0.25
term_tilt: 0.006
detach_matryoshka: true
use_freq_sort: true
initial_k: 60
inner_loss_weight: 0.3
eval_ista_steps: 5
eval_ista_step_size: 0.25

# EXP-009 (agent0): ThresholdEvalSAE — adaptive L0 at eval
# Train with k=25, eval with generous k=50 + threshold at 0.15 of max activation
# Variable L0 should match the true sparsity pattern per-sample
# Hypothesis: fixed k mismatches true L0 (34.5 avg but varies per sample)
sae_class: ThresholdEvalSAE
k: 25
d_sae: 4096
lr: 3e-4
training_samples: 50000000
batch_size: 1024
use_lr_decay: true
lr_warm_up_steps: 1000
matryoshka_widths: [32, 128, 512, 1024, 2048, 4096]
n_ista_steps: 2
ista_step_size: 0.25
term_tilt: 0.012
detach_matryoshka: true
use_freq_sort: true
initial_k: 100
inner_loss_weight: 0.5
eval_ista_steps: 3
eval_threshold: 0.15
eval_min_k: 10
eval_max_k: 50

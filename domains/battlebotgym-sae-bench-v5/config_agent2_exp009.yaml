# EXP-009 (agent2): More training ISTA steps (5) + standard eval ISTA (5)
# Hypothesis: all experiments used n_ista_steps=2 for training. More steps = better feature boundaries.
# Agent0's EXP-017 is similar but uses n_ista=5 + eval_ista=10. I'll try n_ista=5 + eval_ista=5.
sae_class: EvalISTARefStyleSAE
k: 25
d_sae: 4096
lr: 1e-4
training_samples: 50000000
batch_size: 1024
use_lr_decay: true
lr_warm_up_steps: 1000
matryoshka_widths: [32, 128, 512, 1024, 2048, 4096]
n_ista_steps: 5
ista_step_size: 0.25
term_tilt: 0.006
detach_matryoshka: true
use_freq_sort: true
initial_k: 60
inner_loss_weight: 0.3
eval_ista_steps: 5
eval_ista_step_size: 0.25

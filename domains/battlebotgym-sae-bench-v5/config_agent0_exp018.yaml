# EXP-018 (agent0): Asymmetric k — train k=30, eval k=25
# Hypothesis: training with more features gives decoder better separation,
# then stricter eval k selects only the best features
# Using OvershootPruneSAE with k=30 train, k_over=25 eval (no pruning)
sae_class: EvalISTARefStyleSAE
k: 30
d_sae: 4096
lr: 1e-4
training_samples: 50000000
batch_size: 1024
use_lr_decay: true
lr_warm_up_steps: 1000
matryoshka_widths: [32, 128, 512, 1024, 2048, 4096]
n_ista_steps: 2
ista_step_size: 0.25
term_tilt: 0.006
detach_matryoshka: true
use_freq_sort: true
initial_k: 60
inner_loss_weight: 0.3
eval_ista_steps: 5
eval_ista_step_size: 0.25

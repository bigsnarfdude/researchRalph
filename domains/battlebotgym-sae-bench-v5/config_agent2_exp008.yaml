# EXP-008 (agent2): ShrinkEvalISTA — soft-thresholding kills false-positive activations
# After each eval ISTA step, shrink activations by threshold (L1 proximal operator).
# Small FP activations get zeroed out → better precision.
# This is the proper ISTA formulation: z = S_lambda(z + step * D^T(x - Dz))
sae_class: ShrinkEvalISTASAE
k: 25
d_sae: 4096
lr: 1e-4
training_samples: 50000000
batch_size: 1024
use_lr_decay: true
lr_warm_up_steps: 1000
matryoshka_widths: [32, 128, 512, 1024, 2048, 4096]
n_ista_steps: 2
ista_step_size: 0.25
term_tilt: 0.006
detach_matryoshka: true
use_freq_sort: true
initial_k: 60
inner_loss_weight: 0.3
eval_ista_steps: 10
eval_ista_step_size: 0.25
eval_shrinkage: 0.01

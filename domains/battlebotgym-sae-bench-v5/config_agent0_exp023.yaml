# EXP-023 (agent0): BatchRefStyleSAE k=30 — higher capacity with variable L0
# Hypothesis: BatchTopK's variable L0 means k=30 won't hurt precision like fixed TopK k=30 did
sae_class: BatchRefStyleSAE
k: 30
d_sae: 4096
lr: 1e-4
training_samples: 50000000
batch_size: 1024
use_lr_decay: true
lr_warm_up_steps: 1000
matryoshka_widths: [32, 128, 512, 1024, 2048, 4096]
n_ista_steps: 2
ista_step_size: 0.25
term_tilt: 0.006
detach_matryoshka: true
use_freq_sort: true
initial_k: 70
inner_loss_weight: 0.3
k_schedule: cosine
term_start: 0.006
term_end: 0.006

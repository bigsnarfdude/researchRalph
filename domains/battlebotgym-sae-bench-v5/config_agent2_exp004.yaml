# EXP-004 (agent2): SoftSupEvalISTASAE — aggressive precision targeting
# EXP-003 (cls_weight=0.05) matched baseline. Try 4x stronger weight.
# Lower temperature = sharper sigmoid = stronger gradient signal
# Higher fp_weight = even more precision focus
sae_class: SoftSupEvalISTASAE
k: 25
d_sae: 4096
lr: 1e-4
training_samples: 50000000
batch_size: 1024
use_lr_decay: true
lr_warm_up_steps: 1000
matryoshka_widths: [32, 128, 512, 1024, 2048, 4096]
n_ista_steps: 2
ista_step_size: 0.25
term_tilt: 0.006
detach_matryoshka: true
use_freq_sort: true
initial_k: 60
inner_loss_weight: 0.3
eval_ista_steps: 5
eval_ista_step_size: 0.25
cls_weight: 0.2
cls_warmup_frac: 0.3
gt_threshold: 0.1
fp_weight: 5.0
soft_temperature: 0.5

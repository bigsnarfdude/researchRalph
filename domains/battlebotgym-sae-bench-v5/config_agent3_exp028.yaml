# EXP-028 (agent3): BatchRefStyleSAE + ista_step_size=0.5 (larger ISTA steps during training)
# Hypothesis: the eval_step_size=0.5 breakthrough suggests 0.25 is too conservative
# If larger steps help at eval, they might help during training too
# Agent2 found term_tilt=0.003 → 0.822. Using that too.
sae_class: BatchRefStyleSAE
k: 25
d_sae: 4096
lr: 1e-4
training_samples: 50000000
batch_size: 1024
use_lr_decay: true
lr_warm_up_steps: 1000
matryoshka_widths: [32, 128, 512, 1024, 2048, 4096]
n_ista_steps: 2
ista_step_size: 0.5
term_tilt: 0.003
detach_matryoshka: true
use_freq_sort: true
initial_k: 60
inner_loss_weight: 0.3
k_schedule: cosine
term_start: 0.003
term_end: 0.003

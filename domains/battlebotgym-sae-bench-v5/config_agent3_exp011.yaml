# EXP-011 (agent3): GTAlignedEvalISTASAE — GT-supervised auxiliary loss
# Open question #2 from program.md: auxiliary loss aligning decoder to GT directions
# Uses v4 best params + GT alignment after 30% warmup
# 50M for speed — test if GT alignment improves precision
sae_class: GTAlignedEvalISTASAE
k: 25
d_sae: 4096
lr: 1e-4
training_samples: 50000000
batch_size: 1024
use_lr_decay: true
lr_warm_up_steps: 1000
matryoshka_widths: [32, 128, 512, 1024, 2048, 4096]
n_ista_steps: 2
ista_step_size: 0.25
term_tilt: 0.006
detach_matryoshka: true
use_freq_sort: true
initial_k: 60
inner_loss_weight: 0.3
eval_ista_steps: 5
eval_ista_step_size: 0.25
gt_align_weight: 0.01
gt_align_warmup_frac: 0.3

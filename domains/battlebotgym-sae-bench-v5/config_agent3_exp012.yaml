# EXP-012 (agent3): OvershootPruneSAE with v4 best params
# Precision bottleneck strategy: train k=25, eval with k_over=50 + ISTA + prune to 35
# True L0 is ~34.5, so prune_k=35 matches natural sparsity better than k=25
# Uses v4 best params otherwise
sae_class: OvershootPruneSAE
k: 25
d_sae: 4096
lr: 1e-4
training_samples: 50000000
batch_size: 1024
use_lr_decay: true
lr_warm_up_steps: 1000
matryoshka_widths: [32, 128, 512, 1024, 2048, 4096]
n_ista_steps: 2
ista_step_size: 0.25
term_tilt: 0.006
detach_matryoshka: true
use_freq_sort: true
initial_k: 60
inner_loss_weight: 0.3
k_over: 50
prune_k: 35
eval_ista_steps: 5
eval_ista_step_size: 0.25
term_start: 0.009
term_end: 0.006

# EXP-011 (agent2): AvgEvalISTARefStyleSAE — Polyak averaging of last 2 eval ISTA iterates
# Parity effect: odd/even eval ISTA steps oscillate. Averaging smooths this.
# Use 6 eval steps (even) and average last 2 for a fixed-point estimate.
sae_class: AvgEvalISTARefStyleSAE
k: 25
d_sae: 4096
lr: 1e-4
training_samples: 50000000
batch_size: 1024
use_lr_decay: true
lr_warm_up_steps: 1000
matryoshka_widths: [32, 128, 512, 1024, 2048, 4096]
n_ista_steps: 2
ista_step_size: 0.25
term_tilt: 0.006
detach_matryoshka: true
use_freq_sort: true
initial_k: 60
inner_loss_weight: 0.3
eval_ista_steps: 6
eval_ista_step_size: 0.25
avg_last_n: 2

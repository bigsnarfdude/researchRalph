# EXP-014: EvalISTARefStyleSAE with MANY eval ISTA steps (20)
# Hypothesis: 5 eval ISTA steps may not converge. 20 steps = better sparse code at eval.
# Cheap test: only 50M, but eval quality improvement is "free" at test time.
sae_class: EvalISTARefStyleSAE
k: 25
d_sae: 4096
lr: 1e-4
training_samples: 50000000
batch_size: 1024
use_lr_decay: true
lr_warm_up_steps: 1000
matryoshka_widths: [32, 128, 512, 1024, 2048, 4096]
n_ista_steps: 2
ista_step_size: 0.25
term_tilt: 0.006
detach_matryoshka: true
use_freq_sort: true
initial_k: 60
inner_loss_weight: 0.3
eval_ista_steps: 20
eval_ista_step_size: 0.25

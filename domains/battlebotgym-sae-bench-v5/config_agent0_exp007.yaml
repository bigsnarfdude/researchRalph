# EXP-007 (agent0): MultiScaleISTASAE — per-feature learned ISTA step sizes + dec transpose
# Hypothesis: different features need different ISTA corrections; learned step sizes adapt
# Combined with W_dec.T projection (mathematically correct ISTA)
sae_class: MultiScaleISTASAE
k: 25
d_sae: 4096
lr: 3e-4
training_samples: 50000000
batch_size: 1024
use_lr_decay: true
lr_warm_up_steps: 1000
matryoshka_widths: [32, 128, 512, 1024, 2048, 4096]
n_ista_steps: 2
ista_step_size: 0.25
term_tilt: 0.012
detach_matryoshka: true
use_freq_sort: true
initial_k: 100
inner_loss_weight: 0.5
eval_ista_steps: 3
eval_ista_step_size: 0.25
use_dec_transpose: true

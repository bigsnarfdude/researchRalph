# EXP-010 (agent2): No matryoshka + lower inner_loss_weight
# Hypothesis: matryoshka forces features to work at 32/128/512/... widths
# which may compromise quality at full 4096 width. Removing it lets all
# 4096 features optimize independently.
sae_class: EvalISTARefStyleSAE
k: 25
d_sae: 4096
lr: 1e-4
training_samples: 50000000
batch_size: 1024
use_lr_decay: true
lr_warm_up_steps: 1000
matryoshka_widths: [4096]
n_ista_steps: 2
ista_step_size: 0.25
term_tilt: 0.006
detach_matryoshka: true
use_freq_sort: true
initial_k: 60
inner_loss_weight: 0.0
eval_ista_steps: 5
eval_ista_step_size: 0.25

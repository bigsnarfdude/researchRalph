# EXP-019 (agent2): BatchRefStyleSAE + lower term_tilt=0.003
# Current best (agent0 EXP-020): BatchRefStyleSAE, F1=0.82, term_tilt=0.006
# For EvalISTA, term_tilt=0.006 was optimal. BatchTopK might prefer different value.
# Lower tilt = less sparsity pressure = potentially more features activated.
sae_class: BatchRefStyleSAE
k: 25
d_sae: 4096
lr: 1e-4
training_samples: 50000000
batch_size: 1024
use_lr_decay: true
lr_warm_up_steps: 1000
matryoshka_widths: [32, 128, 512, 1024, 2048, 4096]
n_ista_steps: 2
ista_step_size: 0.25
term_tilt: 0.003
detach_matryoshka: true
use_freq_sort: true
initial_k: 60
inner_loss_weight: 0.3
k_schedule: cosine
term_start: 0.003
term_end: 0.003

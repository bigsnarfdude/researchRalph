# EXP-017 (agent3): EvalISTARefStyleSAE + k=30 (between k=25 and true L0=35)
# Hypothesis: k=25 misses ~10 true features per sample. k=30 bridges the gap.
# Program.md says k>25 hurts, but only tested k=40/50. k=30 is unexplored territory.
# The key insight: with EvalISTA, slightly higher k may improve recall without hurting precision
# because ISTA refinement can clean up the extra features better than raw TopK.
sae_class: EvalISTARefStyleSAE
k: 30
d_sae: 4096
lr: 1e-4
training_samples: 50000000
batch_size: 1024
use_lr_decay: true
lr_warm_up_steps: 1000
matryoshka_widths: [32, 128, 512, 1024, 2048, 4096]
n_ista_steps: 2
ista_step_size: 0.25
term_tilt: 0.006
detach_matryoshka: true
use_freq_sort: true
initial_k: 60
inner_loss_weight: 0.3
eval_ista_steps: 5
eval_ista_step_size: 0.25

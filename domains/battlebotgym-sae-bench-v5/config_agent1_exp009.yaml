# EXP-009: DecTransposeISTA — proper ISTA gradient via W_dec.T, k=25
# Uses mathematically correct ISTA gradient instead of W_enc approximation
sae_class: DecTransposeISTASAE
k: 25
d_sae: 4096
lr: 3e-4
training_samples: 50000000
batch_size: 1024
use_lr_decay: true
lr_warm_up_steps: 1000
matryoshka_widths: [32, 128, 512, 1024, 2048, 4096]
n_ista_steps: 2
ista_step_size: 0.25
term_tilt: 0.012
detach_matryoshka: true
use_freq_sort: true
initial_k: 80
inner_loss_weight: 0.5
eval_ista_steps: 5
term_start: 0.015
term_end: 0.006
k_schedule: cosine
use_dec_transpose: true

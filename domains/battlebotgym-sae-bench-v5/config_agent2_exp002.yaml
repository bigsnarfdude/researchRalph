# EXP-002 (agent2): GTAlignedEvalISTASAE + 50M + lr=1e-4 + stronger align weight
# Hypothesis: GT alignment pushes decoder columns toward GT features → better precision
# Agent1 is testing gt_align_weight=0.01. I'll test 0.05 (5x stronger) to map the gradient.
# If precision improves at 50M, scale to 200M next.
sae_class: GTAlignedEvalISTASAE
k: 25
d_sae: 4096
lr: 1e-4
training_samples: 50000000
batch_size: 1024
use_lr_decay: true
lr_warm_up_steps: 1000
matryoshka_widths: [32, 128, 512, 1024, 2048, 4096]
n_ista_steps: 2
ista_step_size: 0.25
term_tilt: 0.006
detach_matryoshka: true
use_freq_sort: true
initial_k: 60
inner_loss_weight: 0.3
eval_ista_steps: 5
eval_ista_step_size: 0.25
gt_align_weight: 0.05
gt_align_warmup_frac: 0.2

# EXP-006 (agent0): Larger d_sae=8192 for better feature resolution
# Hypothesis: 4096 latents for 16k GT features = high confusion; 8192 gives more room
# Combined with eval-time ISTA for precision
sae_class: EvalISTARefStyleSAE
k: 25
d_sae: 8192
lr: 3e-4
training_samples: 50000000
batch_size: 1024
use_lr_decay: true
lr_warm_up_steps: 1000
matryoshka_widths: [64, 256, 1024, 2048, 4096, 8192]
n_ista_steps: 2
ista_step_size: 0.25
term_tilt: 0.012
detach_matryoshka: true
use_freq_sort: true
initial_k: 100
inner_loss_weight: 0.5
eval_ista_steps: 3

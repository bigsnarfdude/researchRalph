# EXP-024: BatchRefStyleSAE with k=30 (BatchTopK may prefer higher k)
# BatchTopK selects top-k across batch, so avg L0 = k but varies per sample.
# Higher k might help BatchTopK cover more features without the precision penalty
# that TopK has, since BatchTopK naturally prunes low-confidence features.
sae_class: BatchRefStyleSAE
k: 30
d_sae: 4096
lr: 1e-4
training_samples: 50000000
batch_size: 1024
use_lr_decay: true
lr_warm_up_steps: 1000
matryoshka_widths: [32, 128, 512, 1024, 2048, 4096]
n_ista_steps: 2
ista_step_size: 0.25
term_tilt: 0.006
detach_matryoshka: true
use_freq_sort: true
initial_k: 60
inner_loss_weight: 0.3
k_schedule: cosine
term_start: 0.006
term_end: 0.006

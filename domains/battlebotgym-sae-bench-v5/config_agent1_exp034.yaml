# EXP-034: BatchRefStyleSAE + 200M + inner_loss_weight=0.6
# Agent3 EXP-032 hit F1=0.8998 with ilw=0.6 (vs my 0.894 at 0.5)
# Fine-tuning the sweet spot between 0.5 and 0.7
sae_class: BatchRefStyleSAE
k: 25
d_sae: 4096
lr: 1e-4
training_samples: 200000000
batch_size: 1024
use_lr_decay: true
lr_warm_up_steps: 1000
matryoshka_widths: [32, 128, 512, 1024, 2048, 4096]
n_ista_steps: 2
ista_step_size: 0.25
term_tilt: 0.003
detach_matryoshka: true
use_freq_sort: true
initial_k: 60
inner_loss_weight: 0.6
k_schedule: cosine
term_start: 0.003
term_end: 0.003
